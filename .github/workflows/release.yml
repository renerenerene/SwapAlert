name: Build release app

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-attach:
    runs-on: macos-14
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4

      - name: Build Apple Silicon app
        run: |
          chmod +x scripts/build_app.sh
          ./scripts/build_app.sh

      - name: Create release archive
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: ditto -c -k --keepParent dist/SwapAlert.app "SwapAlert-${RELEASE_TAG}-macOS-arm64.zip"

      - name: Attach archive to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" "SwapAlert-${RELEASE_TAG}-macOS-arm64.zip" --clobber
